<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>生词练习</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Inter:wght@300;400;500;600&display=swap');
  :root {
    --green:#3d9c6e; --green-light:#eaf7f1; --green-dark:#2a6e4d;
    --cream:#f5f5f7; --ink:#1a1a2e; --red:#e05c5c; --gold:#c9a84c;
    --shadow:0 4px 24px rgba(0,0,0,0.10); --r:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--cream);font-family:'Inter',system-ui,sans-serif;color:var(--ink)}
  #app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto;position:relative;overflow:hidden}
  .topbar{background:white;padding:14px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,0.06);z-index:10}
  .topbar-title{font-family:'Noto Serif SC',serif;font-size:1.05rem;font-weight:700;color:var(--green-dark)}
  .topbar-sub{font-size:0.68rem;color:#aaa;margin-top:2px}
  .topbar-add{width:38px;height:38px;border-radius:50%;background:var(--green);color:white;border:none;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(61,156,110,0.35)}
  .bottomnav{background:white;display:flex;justify-content:space-around;padding:10px 0 16px;border-top:1px solid rgba(0,0,0,0.06);z-index:10}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:4px 18px;font-size:0.65rem;font-weight:500;color:#aaa;transition:color 0.2s;font-family:'Inter',sans-serif}
  .nav-item svg{width:22px;height:22px;stroke-width:2}
  .nav-item.active{color:var(--green)}
  #content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px;display:flex;flex-direction:column;align-items:center;-webkit-overflow-scrolling:touch}
  .pill-row{display:flex;gap:6px;width:100%;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
  .pill-row::-webkit-scrollbar{display:none}
  .pill{padding:6px 14px;border-radius:20px;border:1.5px solid var(--green);background:transparent;color:var(--green-dark);font-size:0.73rem;font-weight:500;cursor:pointer;white-space:nowrap;transition:all 0.18s;font-family:'Inter',sans-serif}
  .pill.active{background:var(--green);color:white}
  .prog-wrap{width:100%;margin-bottom:6px}
  .prog-bar{height:3px;background:rgba(61,156,110,0.15);border-radius:2px;overflow:hidden}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:2px;transition:width 0.4s}
  .prog-label{font-size:0.72rem;color:#bbb;text-align:right;margin-top:4px}
  .card-scene{perspective:1000px;width:100%;height:210px;margin-bottom:18px;cursor:pointer}
  .card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.5s cubic-bezier(0.4,0.2,0.2,1)}
  .card-inner.flipped{transform:rotateY(180deg)}
  .card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-shadow:var(--shadow)}
  .card-front{background:white}
  .card-back{background:linear-gradient(135deg,var(--green-dark),var(--green));transform:rotateY(180deg);color:white}
  .card-char{font-family:'Noto Serif SC',serif;font-size:3.8rem;font-weight:700;line-height:1}
  .card-badge{position:absolute;top:12px;left:14px;font-size:0.65rem;background:var(--green-light);color:var(--green-dark);padding:2px 8px;border-radius:20px;font-weight:600}
  .card-back .card-badge{background:rgba(255,255,255,0.18);color:rgba(255,255,255,0.85)}
  .card-tap{font-size:0.68rem;color:#ccc;margin-top:12px;font-style:italic}
  .back-pin{font-size:1.4rem;font-weight:600;letter-spacing:0.06em;margin-bottom:8px;opacity:0.95}
  .back-mean{font-size:0.95rem;opacity:0.82;text-align:center;font-style:italic}
  .back-ghost{font-family:'Noto Serif SC',serif;font-size:2.8rem;opacity:0.15;position:absolute;bottom:12px;right:16px}
  .toggle-row{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:14px;cursor:pointer;user-select:none}
  .tog-track{width:40px;height:24px;background:rgba(0,0,0,0.1);border-radius:12px;position:relative;transition:background 0.2s;flex-shrink:0}
  .tog-track.on{background:var(--green)}
  .tog-knob{width:20px;height:20px;background:white;border-radius:50%;position:absolute;top:2px;left:2px;transition:left 0.2s;box-shadow:0 1px 4px rgba(0,0,0,0.2)}
  .tog-track.on .tog-knob{left:18px}
  .toggle-label{font-size:0.82rem;color:#888}
  .nav-btns{display:flex;gap:10px;width:100%}
  .nbtn{flex:1;padding:13px;border-radius:12px;border:none;font-family:'Inter',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;transition:all 0.18s}
  .nbtn-sec{background:white;color:var(--green);border:1.5px solid var(--green);box-shadow:0 2px 8px rgba(0,0,0,0.05)}
  .nbtn-pri{background:var(--green);color:white;box-shadow:0 4px 12px rgba(61,156,110,0.3)}
  .nbtn:active{transform:scale(0.97)}
  .dictado-card{width:100%;background:white;border-radius:var(--r);padding:24px 20px;box-shadow:var(--shadow);text-align:center;margin-bottom:14px}
  .d-prompt{font-size:0.72rem;color:#bbb;margin-bottom:8px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase}
  .d-pin{font-size:2rem;color:var(--green);font-weight:700;letter-spacing:0.06em;margin-bottom:18px;font-family:'Noto Serif SC',serif}
  .d-input{width:100%;border:2px solid rgba(0,0,0,0.08);border-radius:12px;padding:12px;font-family:'Noto Serif SC',serif;font-size:1.8rem;text-align:center;outline:none;color:var(--ink);background:var(--cream);transition:border-color 0.2s;margin-bottom:12px}
  .d-input:focus{border-color:var(--green)}
  .d-input.correct{border-color:#3dbb77;background:#eafaf1}
  .d-input.wrong{border-color:var(--red);background:#fff0f0}
  .d-answer{font-family:'Noto Serif SC',serif;font-size:1.5rem;font-weight:700;color:var(--green-dark);min-height:30px}
  .d-meaning{font-size:0.85rem;color:#aaa;font-style:italic;min-height:18px;margin-top:4px}
  .score-row{display:flex;gap:20px;justify-content:center;margin-top:12px}
  .score-item{text-align:center}
  .score-val{font-size:1.4rem;font-weight:700}
  .score-lbl{font-size:0.68rem;color:#bbb;margin-top:2px}
  .s-ok .score-val{color:#3dbb77}
  .s-no .score-val{color:var(--red)}
  .section-hdr{width:100%;font-family:'Noto Serif SC',serif;font-size:0.78rem;color:var(--green-dark);font-weight:700;letter-spacing:0.08em;padding:10px 4px 6px;border-bottom:1.5px solid rgba(61,156,110,0.18);margin-bottom:6px;margin-top:4px}
  .word-row{width:100%;display:flex;align-items:center;background:white;border-radius:12px;padding:11px 14px;gap:10px;margin-bottom:6px;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
  .wr-char{font-family:'Noto Serif SC',serif;font-size:1.2rem;font-weight:700;min-width:52px}
  .wr-pin{color:var(--green);font-size:0.8rem;flex:1;font-weight:500}
  .wr-mean{font-size:0.75rem;color:#aaa;text-align:right;font-style:italic;max-width:110px}
  .wr-del{background:none;border:none;color:#ddd;font-size:1rem;cursor:pointer;padding:4px;flex-shrink:0}
  .sheet-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.4);z-index:100;display:none;align-items:flex-end;backdrop-filter:blur(2px)}
  .sheet-overlay.open{display:flex}
  .sheet{width:100%;background:white;border-radius:24px 24px 0 0;padding:20px 20px 32px;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1)}
  .sheet-overlay.open .sheet{transform:translateY(0)}
  .sheet-handle{width:40px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 18px}
  .sheet-title{font-size:1rem;font-weight:700;margin-bottom:16px;color:var(--ink)}
  .field-label{font-size:0.72rem;font-weight:600;color:#aaa;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:5px}
  .field-input{width:100%;border:1.5px solid rgba(0,0,0,0.1);border-radius:10px;padding:11px 13px;font-size:1rem;outline:none;color:var(--ink);margin-bottom:12px;background:var(--cream);transition:border-color 0.2s;font-family:'Inter',sans-serif}
  .field-input:focus{border-color:var(--green)}
  .field-char{font-family:'Noto Serif SC',serif;font-size:1.4rem}
  .part-pick{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .pp-btn{flex:1;padding:9px;border-radius:10px;border:1.5px solid rgba(0,0,0,0.1);background:var(--cream);font-size:0.75rem;font-weight:600;cursor:pointer;color:#888;transition:all 0.18s;font-family:'Inter',sans-serif;white-space:nowrap}
  .pp-btn.sel{border-color:var(--green);background:var(--green-light);color:var(--green-dark)}
  .sheet-save{width:100%;padding:14px;border-radius:12px;border:none;background:var(--green);color:white;font-size:1rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 4px 14px rgba(61,156,110,0.3)}
  .err-msg{font-size:0.78rem;color:var(--red);margin-bottom:8px;min-height:16px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div>
      <div class="topbar-title">生词练习</div>
      <div class="topbar-sub">Vocabulario Chino · Instituto Confucio · by Daniel Camones</div>
    </div>
    <button class="topbar-add" onclick="openSheet()">+</button>
  </div>

  <div id="content"></div>

  <div class="bottomnav">
    <button class="nav-item active" id="nav-flash" onclick="setMode('flash')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="3" width="20" height="14" rx="3"/><path d="M8 21h8M12 17v4"/></svg>
      Flashcards
    </button>
    <button class="nav-item" id="nav-dictado" onclick="setMode('dictado')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Dictado
    </button>
    <button class="nav-item" id="nav-lista" onclick="setMode('lista')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Lista
    </button>
  </div>

  <div class="sheet-overlay" id="sheet-overlay" onclick="overlayClick(event)">
    <div class="sheet" id="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Agregar nueva palabra</div>
      <div class="field-label">Carácter 汉字</div>
      <input class="field-input field-char" id="inp-char" placeholder="例：学习" maxlength="6">
      <div class="field-label">Pinyin</div>
      <input class="field-input" id="inp-pin" placeholder="例：xuéxí" maxlength="30">
      <div class="field-label">Significado</div>
      <input class="field-input" id="inp-mean" placeholder="ejemplo: estudiar" maxlength="60">
      <div class="field-label">Sección</div>
      <div class="part-pick">
        <button class="pp-btn sel" id="pp-p1" onclick="selectPart('p1')">P139-140</button>
        <button class="pp-btn" id="pp-p2" onclick="selectPart('p2')">P143-144</button>
        <button class="pp-btn" id="pp-l36" onclick="selectPart('l36')">L36</button>
        <button class="pp-btn" id="pp-extra" onclick="selectPart('extra')">Extra</button>
      </div>
      <div class="err-msg" id="err-msg"></div>
      <button class="sheet-save" onclick="saveWord()">Guardar palabra</button>
    </div>
  </div>
</div>

  {char:"然后",pin:"ránhòu",mean:"después / más tarde",part:"l37"},
  {char:"接着",pin:"jiēzhe",mean:"seguir / continuar",part:"l37"},
  {char:"愉快",pin:"yúkuài",mean:"alegre / jubiloso",part:"l37"},
  {char:"蒙族",pin:"Měngzú",mean:"grupo étnico de Mongolia",part:"l37"},
  {char:"新疆",pin:"Xīnjiāng",mean:"Xinjiang (región autónoma de China)",part:"l37"}
];

var customWords = [];
try {
  var saved = localStorage.getItem('chino-custom-words');
  if (saved) customWords = JSON.parse(saved);
} catch(e) { customWords = []; }

var mode = 'flash';
var currentPart = 'all';
var randomOn = false;
var vocab = [];
var flashOrder = [], flashIdx = 0, flipped = false;
var dictOrder = [], dictIdx = 0, scoreOk = 0, scoreNo = 0;
var newPart = 'p1';

function allWords() { return BASE_V1.concat(BASE_V2).concat(BASE_L36).concat(BASE_L37).concat(customWords); }

function rebuildVocab() {
  var all = allWords();
  if (currentPart === 'all') vocab = all;
  else if (currentPart === 'extra') vocab = customWords.slice();
  else vocab = all.filter(function(w){ return w.part === currentPart; });
  if (vocab.length === 0) vocab = all;
}

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length-1; i>0; i--) {
    var j = Math.floor(Math.random()*(i+1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

function partLabel(p) {
  if (p==='p1') return 'P139-140';
  if (p==='p2') return 'P143-144';
  if (p==='l36') return 'L36';
  if (p==='l37') return 'L37';
  return 'Extra';
}

function initFlashOrder() {
  var idx = [];
  for (var i=0; i<vocab.length; i++) idx.push(i);
  flashOrder = randomOn ? shuffle(idx) : idx;
}

function setProgress(i, total) {
  var pct = total ? ((i+1)/total*100) : 0;
  var fb = document.getElementById('prog-fill');
  var fl = document.getElementById('prog-label');
  if (fb) fb.style.width = pct + '%';
  if (fl) fl.textContent = (i+1) + ' / ' + total;
}

function pillsHTML() {
  var hasExtra = customWords.length > 0;
  var parts = [
    {k:'all', l:'Todas'},
    {k:'p1',  l:'P139-140'},
    {k:'p2',  l:'P143-144'},
    {k:'l36', l:'L36'},
    {k:'l37', l:'L37'}
  ];
  if (hasExtra) parts.push({k:'extra', l:'Extra ✦'});
  var h = '<div class="pill-row">';
  parts.forEach(function(p){
    h += '<button class="pill' + (currentPart===p.k?' active':'') + '" onclick="setPart(\''+p.k+'\')">' + p.l + '</button>';
  });
  return h + '</div>';
}

function progHTML(i, total) {
  var pct = total ? ((i+1)/total*100) : 0;
  return '<div class="prog-wrap"><div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:'+pct+'%"></div></div><div class="prog-label" id="prog-label">'+(i+1)+' / '+total+'</div></div>';
}

// ── FLASH ──
function flashHTML() {
  var w = vocab[flashOrder[flashIdx]] || vocab[0];
  return pillsHTML() + progHTML(flashIdx, vocab.length) +
    '<div class="toggle-row" onclick="toggleRandom()">' +
      '<div class="tog-track'+(randomOn?' on':'')+'"><div class="tog-knob"></div></div>' +
      '<span class="toggle-label">Orden aleatorio</span>' +
    '</div>' +
    '<div class="card-scene" onclick="flipCard()">' +
      '<div class="card-inner'+(flipped?' flipped':'')+'" id="card-inner">' +
        '<div class="card-face card-front">' +
          '<div class="card-badge">'+partLabel(w.part)+'</div>' +
          '<div class="card-char">'+w.char+'</div>' +
          '<div class="card-tap">toca para ver el significado</div>' +
        '</div>' +
        '<div class="card-face card-back">' +
          '<div class="card-badge">'+partLabel(w.part)+'</div>' +
          '<div class="back-pin">'+w.pin+'</div>' +
          '<div class="back-mean">'+w.mean+'</div>' +
          '<div class="back-ghost">'+w.char+'</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="nav-btns">' +
      '<button class="nbtn nbtn-sec" onclick="prevCard()">← Anterior</button>' +
      '<button class="nbtn nbtn-pri" onclick="nextCard()">Siguiente →</button>' +
    '</div>';
}

function flipCard() {
  flipped = !flipped;
  var el = document.getElementById('card-inner');
  if (el) el.classList.toggle('flipped', flipped);
}
function nextCard() { flashIdx=(flashIdx+1)%vocab.length; flipped=false; render(); }
function prevCard() { flashIdx=(flashIdx-1+vocab.length)%vocab.length; flipped=false; render(); }
function toggleRandom() { randomOn=!randomOn; flashIdx=0; flipped=false; initFlashOrder(); render(); }

// ── DICTADO ──
function dictadoHTML() {
  var w = vocab[dictOrder[dictIdx]||0] || vocab[0];
  return pillsHTML() + progHTML(dictIdx, vocab.length) +
    '<div class="dictado-card">' +
      '<div class="d-prompt">Escribe el carácter para</div>' +
      '<div class="d-pin">'+w.pin+'</div>' +
      '<input class="d-input" id="d-input" placeholder="写汉字…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" oninput="checkDictado()">' +
      '<div class="d-answer" id="d-answer"></div>' +
      '<div class="d-meaning" id="d-meaning"></div>' +
    '</div>' +
    '<div class="nav-btns">' +
      '<button class="nbtn nbtn-sec" onclick="showAnswer()">Ver respuesta</button>' +
      '<button class="nbtn nbtn-pri" onclick="nextDictado()">Siguiente →</button>' +
    '</div>' +
    '<div class="score-row">' +
      '<div class="score-item s-ok"><div class="score-val">'+scoreOk+'</div><div class="score-lbl">Correctas</div></div>' +
      '<div class="score-item s-no"><div class="score-val">'+scoreNo+'</div><div class="score-lbl">Incorrectas</div></div>' +
    '</div>';
}

function checkDictado() {
  var w = vocab[dictOrder[dictIdx]||0] || vocab[0];
  var inp = document.getElementById('d-input');
  if (!inp || inp.disabled) return;
  if (inp.value.trim() === w.char) {
    inp.className='d-input correct'; inp.disabled=true;
    document.getElementById('d-answer').textContent = '✓ '+w.char;
    document.getElementById('d-meaning').textContent = w.mean;
    scoreOk++;
    setTimeout(nextDictado, 1200);
  }
}

function showAnswer() {
  var w = vocab[dictOrder[dictIdx]||0] || vocab[0];
  var inp = document.getElementById('d-input');
  if (!inp || inp.disabled) return;
  inp.className='d-input wrong'; inp.disabled=true;
  document.getElementById('d-answer').textContent = w.char;
  document.getElementById('d-meaning').textContent = w.mean;
  scoreNo++;
}

function nextDictado() { dictIdx=(dictIdx+1)%vocab.length; render(); }

// ── LISTA ──
function listaHTML() {
  var html = pillsHTML();
  var groups;
  if (currentPart === 'all') {
    groups = [
      {label:'P139-140', words: BASE_V1},
      {label:'P143-144', words: BASE_V2},
      {label:'L36',      words: BASE_L36},
      {label:'L37',      words: BASE_L37}
    ];
    if (customWords.length) groups.push({label:'Extra ✦', words: customWords});
  } else {
    var lbl = currentPart==='p1'?'P139-140': currentPart==='p2'?'P143-144': currentPart==='l36'?'L36': currentPart==='l37'?'L37':'Extra ✦';
    groups = [{label: lbl, words: vocab}];
  }
  groups.forEach(function(g){
    html += '<div class="section-hdr">'+g.label+'</div>';
    g.words.forEach(function(w){
      var isCustom = customWords.indexOf(w) !== -1;
      var idx = customWords.indexOf(w);
      html += '<div class="word-row">' +
        '<div class="wr-char">'+w.char+'</div>' +
        '<div class="wr-pin">'+w.pin+'</div>' +
        '<div class="wr-mean">'+w.mean+'</div>' +
        (isCustom ? '<button class="wr-del" onclick="deleteWord('+idx+')">✕</button>' : '') +
        '</div>';
    });
  });
  return html;
}

function deleteWord(idx) {
  customWords.splice(idx, 1);
  try { localStorage.setItem('chino-custom-words', JSON.stringify(customWords)); } catch(e){}
  rebuildVocab(); render();
}

// ── SHEET ──
function openSheet() {
  document.getElementById('err-msg').textContent = '';
  document.getElementById('inp-char').value = '';
  document.getElementById('inp-pin').value = '';
  document.getElementById('inp-mean').value = '';
  selectPart('p1');
  var ov = document.getElementById('sheet-overlay');
  ov.style.display = 'flex';
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ ov.classList.add('open'); });
  });
}

function closeSheet() {
  var ov = document.getElementById('sheet-overlay');
  ov.classList.remove('open');
  setTimeout(function(){ ov.style.display='none'; }, 350);
}

function overlayClick(e) {
  if (e.target === document.getElementById('sheet-overlay')) closeSheet();
}

function selectPart(p) {
  newPart = p;
  ['p1','p2','l36','extra'].forEach(function(k){
    var el = document.getElementById('pp-'+k);
    if (el) el.classList.toggle('sel', k===p);
  });
}

function saveWord() {
  var char = document.getElementById('inp-char').value.trim();
  var pin  = document.getElementById('inp-pin').value.trim();
  var mean = document.getElementById('inp-mean').value.trim();
  var err  = document.getElementById('err-msg');
  if (!char) { err.textContent='Ingresa el carácter 汉字'; return; }
  if (!pin)  { err.textContent='Ingresa el pinyin'; return; }
  if (!mean) { err.textContent='Ingresa el significado'; return; }
  err.textContent = '';
  customWords.push({char:char, pin:pin, mean:mean, part:newPart});
  try { localStorage.setItem('chino-custom-words', JSON.stringify(customWords)); } catch(e){}
  closeSheet();
  rebuildVocab();
  render();
}

// ── MODE / PART ──
function setMode(m) {
  mode = m;
  if (m !== 'dictado') { dictOrder = []; dictIdx = 0; scoreOk = 0; scoreNo = 0; }
  ['flash','dictado','lista'].forEach(function(k){
    var el = document.getElementById('nav-'+k);
    if (el) el.classList.toggle('active', k===m);
  });
  flipped = false;
  render();
}

function setPart(p) {
  currentPart = p;
  flashIdx = 0; flipped = false;
  dictOrder = []; dictIdx = 0; scoreOk = 0; scoreNo = 0;
  rebuildVocab(); initFlashOrder();
  render();
}

function render() {
  rebuildVocab();
  var c = document.getElementById('content');
  if (!c) return;
  if (mode === 'flash')   { c.innerHTML = flashHTML(); }
  if (mode === 'dictado') { c.innerHTML = dictadoHTML(); setTimeout(function(){ var i=document.getElementById('d-input'); if(i) i.focus(); }, 100); }
  if (mode === 'lista')   { c.innerHTML = listaHTML(); }
}

// ── START ──
rebuildVocab();
initFlashOrder();
render();
</script>
</body>
</html>
